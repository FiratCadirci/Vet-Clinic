server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vetclinic
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: vet
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    schemas: vet
    url: ${FLYWAY_URL:${DB_URL}}
    user: ${FLYWAY_USER:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  sql:
    init:
      mode: never
  web:
    locale: tr
    locale-resolver: fixed
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000

  security:
    user:
      name: ${APP_ADMIN_USER:admin}
      password: ${APP_ADMIN_PASSWORD:change-me}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  web-url: ${WEB_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:VetClinic <no-reply@vetclinic.local>}
  push:
    enabled: ${PUSH_ENABLED:false}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    jwt:
      secret: ${JWT_SECRET:change-this-jwt-secret-key-with-at-least-32-characters}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}
  storage:
    local:
      root: ${STORAGE_ROOT:./storage}
    max-attachment-bytes: 10485760
