# Geliştirme:  docker compose up -d   → PostgreSQL + Mailpit (e-posta test sunucusu)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
      POSTGRES_DB: vetclinic
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet -d vetclinic"]
      interval: 3s
      retries: 20

  mail:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  dbdata:
